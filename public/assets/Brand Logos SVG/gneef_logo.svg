<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 200 200">
  <!-- Gneef Brand Logo — Custom Geometric Wordmark -->
  <!-- Bold, iconic, Swiss-inspired design with custom letterforms -->
  <defs>
    <style>
      .st0 { fill: #fff; }
    </style>
  </defs>

  <!--
    LAYOUT (viewBox 0 0 200 200):
    Word "Gneef" centered vertically around y=100
    Letter height: 36px  (baseline y=118, cap-height y=82)
    Total word width: ~172px, starting x=14
    Letters:  G  N  E  E  F
    x-starts: 14 54 90 118 146

    Stroke weight: 7px
  -->

  <!-- ══════════════════ G ══════════════════ -->
  <!-- Bold geometric G: circular arc with open right side + crossbar -->
  <path class="st0" d="
    M 46,82
    C 28,82 14,93.8 14,108
    C 14,122.2 28,134 46,134
    C 56,134 64.8,130 71,123.5
    L 71,105
    L 51,105
    L 51,111
    L 64,111
    L 64,121
    C 59.5,125.5 53,128 46,128
    C 31.6,128 20,119.2 20,108
    C 20,96.8 31.6,88 46,88
    C 53.5,88 60.2,90.8 65,95.5
    L 69,91
    C 63,85.5 55,82 46,82
    Z
  "/>
  <!-- G crossbar horizontal fill -->
  <rect class="st0" x="51" y="105" width="13" height="6"/>

  <!-- ══════════════════ N ══════════════════ -->
  <!-- Bold N: two verticals + diagonal stroke -->
  <polygon class="st0" points="
    56,82  63,82  63,134  56,134
  "/>
  <!-- diagonal of N -->
  <polygon class="st0" points="
    63,82  63,90  83,122  83,134
    76,134 76,126  56,94  56,82
  "/>
  <!-- right vertical of N -->
  <polygon class="st0" points="
    76,82  83,82  83,134  76,134
  "/>

  <!-- ══════════════════ E (first) ══════════════════ -->
  <!-- Bold E: vertical + 3 horizontals -->
  <rect class="st0" x="90" y="82" width="7" height="52"/>
  <rect class="st0" x="90" y="82" width="24" height="7"/>
  <rect class="st0" x="90" y="105" width="20" height="7"/>
  <rect class="st0" x="90" y="127" width="24" height="7"/>

  <!-- ══════════════════ E (second) ══════════════════ -->
  <!-- Bold E: vertical + 3 horizontals -->
  <rect class="st0" x="120" y="82" width="7" height="52"/>
  <rect class="st0" x="120" y="82" width="24" height="7"/>
  <rect class="st0" x="120" y="105" width="20" height="7"/>
  <rect class="st0" x="120" y="127" width="24" height="7"/>

  <!-- ══════════════════ F ══════════════════ -->
  <!-- Bold F: vertical + 2 horizontals (iconic - no bottom bar, with diagonal cut at top-right) -->
  <rect class="st0" x="150" y="82" width="7" height="52"/>
  <!-- Top bar of F with angled right edge (iconic notch) -->
  <polygon class="st0" points="150,82 179,82 186,89 150,89"/>
  <!-- Middle bar of F -->
  <rect class="st0" x="150" y="105" width="22" height="7"/>

</svg>
